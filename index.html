"en":"The target group is named as precisely as possible.","de":"Die Zielgruppe ist so genau wie möglich benannt."},"example":{"en":"Target group: [discipline, role].","de":"Zielgruppe: [Disziplin, Rolle]."}},{"q":{"en":"Added value","de":"Mehrwert"},"hint":{"en":"The benefit is specific: time, quality or FAIRness.","de":"Der Nutzen ist konkret: Zeit, Qualität oder FAIRness."},"example":{"en":"Added value: [for example saves x hours per dataset]. Users evaluated by [survey / workshop, date].","de":"Mehrwert: [zum Beispiel spart x Stunden je Datensatz]. Nutzende evaluiert durch [Umfrage / Workshop, Datum]."}},{"q":{"en":"Examples","de":"Beispiele"},"hint":{"en":"At least 2 examples can be traced, with a link, project or workflow.","de":"Mindestens 2 Beispiele sind nachvollziehbar, mit Link, Projekt oder Workflow."},"example":{"en":"Examples: [example 1, link], [example 2, link].","de":"Beispiele: [Beispiel 1, Link], [Beispiel 2, Link]."}}],"levels":[{"result":"Met","rule":{"en":"All four checks are yes, with 2 traceable examples","de":"Alle vier Prüfpunkte sind mit Ja beantwortet, mit 2 nachvollziehbaren Beispielen"},"when":{"required":[0,1,2,3]}},{"result":"Partly met","rule":{"en":"Purpose and target group are clear, but examples or value are thin, with a dated plan","de":"Zweck und Zielgruppe sind klar, Beispiele oder Mehrwert aber dünn, mit terminiertem Plan"},"when":{"required":[0,1]}},{"result":"Not met","rule":{"en":"General claims only, no examples","de":"Nur allgemeine Aussagen, keine Beispiele"}}],"scoringIntro":{"en":"The reviewer checks two concrete application examples in detail.","de":"Die prüfende Person prüft zwei konkrete Anwendungsbeispiele im Detail."},"scoringNote":"","whyForm":{"en":"Purpose and benefit cannot be reduced to a threshold. Concrete examples carry the rating.","de":"Zweck und Nutzen lassen sich nicht auf einen Schwellenwert reduzieren. Konkrete Beispiele tragen die Bewertung."},"tags":[]},{"id":"k12","number":12,"title":{"en":"Use and acceptance","de":"Nutzung und Akzeptanz"},"category":"fachlich","form":"binary","checklistLabel":"Checks","asks":[{"label":"Should","text":{"en":"The service is accepted by a sufficiently large part of its community. This is shown mainly through actual use.","de":"Der Dienst ist in seiner Community ausreichend breit akzeptiert. Das wird vor allem durch die tatsächliche Nutzung belegt."}},{"label":"Should","text":{"en":"Usage metrics that fit the service are defined and collected regularly. A qualitative description can add to them or replace them.","de":"Zum Dienst passende Nutzungsmetriken sind festgelegt und werden regelmäßig erhoben. Eine qualitative Beschreibung kann sie ergänzen oder ersetzen."}},{"label":"Optional","text":{"en":"If no usage data exists yet, it is explained how use is estimated today and how it will be shown in future. (Usage data is not required at the time of review.)","de":"Liegen noch keine Nutzungsdaten vor, ist erklärt, wie die Nutzung heute eingeschätzt wird und wie sie künftig gezeigt werden soll. (Nutzungsdaten sind zum Zeitpunkt der Prüfung nicht erforderlich.)"}},{"label":"Should","text":{"en":"The metrics are collected for defined periods, for example daily or monthly. Manual collection is fine for now, automatic collection is better. All indicators can be provided per calendar year.","de":"Die Metriken werden für festgelegte Zeiträume erhoben, zum Beispiel täglich oder monatlich. Manuelle Erhebung ist vorerst in Ordnung, automatische ist besser. Alle Indikatoren können je Kalenderjahr geliefert werden."}},{"label":"Optional","text":{"en":"Possible indicators are active users, communities or institutions reached, storage used, data products and publications. Several metrics can be combined. (Optional.)","de":"Mögliche Indikatoren sind aktive Nutzende, erreichte Communities oder Institutionen, belegter Speicher, Datenprodukte und Publikationen. Mehrere Metriken können kombiniert werden. (Optional.)"}},{"label":"Should","text":{"en":"If metrics are missing, use is described qualitatively, for example with feedback, documented use cases or integration in research projects.","de":"Fehlen Metriken, wird die Nutzung qualitativ beschrieben, zum Beispiel mit Rückmeldungen, dokumentierten Anwendungsfällen oder der Einbindung in Forschungsprojekte."}}],"typeHelp":{"software":{"en":"Active users per period, logins, institutions, API calls, releases and downloads","de":"Aktive Nutzende pro Zeitraum, Logins, Institutionen, API-Aufrufe, Releases und Downloads"},"storage":{"en":"Stored data volume, number of datasets, downloads, depositors","de":"Gespeichertes Datenvolumen, Anzahl der Datensätze, Downloads, Einstellende"},"other":{"en":"Number of terms or profiles, reuse in other services, external adoption","de":"Anzahl der Begriffe oder Profile, Nachnutzung in anderen Diensten, externe Übernahme"},"training":{"en":"Participants, courses held, material downloads, reuse","de":"Teilnehmende, durchgeführte Kurse, Material-Downloads, Nachnutzung"},"consulting":{"en":"Cases, groups advised, follow-up requests","de":"Fälle, beratene Gruppen, Folgeanfragen"},"process":{"en":"Groups using it, runs, adoption by others","de":"Nutzende Gruppen, Läufe, Übernahme durch andere"}},"evidence":[{"en":"List of defined indicators, with period and collection method (manual or automatic)","de":"Liste der definierten Indikatoren, mit Zeitraum und Erhebungsmethode (manuell oder automatisch)"},{"en":"Latest figures, ideally for a full calendar year","de":"Aktuelle Zahlen, idealerweise für ein volles Kalenderjahr"},{"en":"For qualitative answers: feedback, documented use cases or project references, with dates","de":"Bei qualitativen Antworten: Rückmeldungen, dokumentierte Anwendungsfälle oder Projektreferenzen, mit Datum"},{"en":"Short plan for future measurement, with a date","de":"Kurzer Plan für die künftige Messung, mit Datum"}],"tips":[{"en":"**Combine metrics** if useful. The criterion says several can be combined.","de":"**Kombinieren Sie Metriken**, wenn sinnvoll. Das Kriterium sagt, dass mehrere kombiniert werden können."},{"en":"Choose indicators tied to the goal of the service.","de":"Wählen Sie Indikatoren, die zum Ziel des Dienstes passen."},{"en":"\"No data yet\" is acceptable if you explain the estimate and the plan.","de":"„Noch keine Daten“ ist akzeptabel, wenn Sie die Einschätzung und den Plan erklären."},{"en":"Report aggregates where personal data is a concern (see criterion 5).","de":"Berichten Sie Aggregate, wo personenbezogene Daten ein Thema sind (siehe Kriterium 5)."}],"questions":[{"q":{"en":"1 Indicators","de":"1 Indikatoren"},"hint":{"en":"Usage indicators that fit the goal of the service are defined.","de":"Nutzungsindikatoren, die zum Ziel des Dienstes passen, sind festgelegt."},"example":{"en":"Indicators: [active users per month, institutions, stored data volume], collected [automatically / manually] each [period].","de":"Indikatoren: [aktive Nutzende pro Monat, Institutionen, gespeichertes Datenvolumen], erhoben [automatisch / manuell] je [Zeitraum]."}},{"q":{"en":"2 Figures","de":"2 Zahlen"},"hint":{"en":"The latest figures are given for a stated period, with a checkable source.","de":"Die aktuellen Zahlen sind für einen genannten Zeitraum angegeben, mit prüfbarer Quelle."},"example":{"en":"Latest figures ([month/year]): [values]. Source: [link or report].","de":"Aktuelle Zahlen ([Monat/Jahr]): [Werte]. Quelle: [Link oder Bericht]."}},{"q":{"en":"3 Qualitative evidence","de":"3 Qualitative Nachweise"},"hint":{"en":"If figures are missing, qualitative evidence is listed: feedback, use cases or integration in projects.","de":"Fehlen Zahlen, sind qualitative Nachweise aufgelistet: Rückmeldungen, Anwendungsfälle oder Einbindung in Projekte."},"example":{"en":"Qualitative evidence ([date]): feedback from [workshops / users], use cases [list], integration in [projects].","de":"Qualitative Nachweise ([Datum]): Rückmeldungen aus [Workshops / von Nutzenden], Anwendungsfälle [Liste], Einbindung in [Projekte]."}},{"q":{"en":"4 Plan","de":"4 Plan"},"hint":{"en":"If the data is incomplete, a dated plan to collect it exists. Answer N/A if the data is complete.","de":"Sind die Daten unvollständig, existiert ein terminierter Plan zur Erhebung. Antworten Sie mit „Nicht anwendbar“, wenn die Daten vollständig sind."},"example":{"en":"Planned: [indicators / automation] by [date].","de":"Geplant: [Indikatoren / Automatisierung] bis [Datum]."}}],"levels":[{"result":"Met","rule":{"en":"The latest statistics are given (figures with a period and a checkable source), the indicators fit the service goal, and a dated plan exists if data is incomplete. For new services, listed qualitative evidence plus a dated plan counts as the latest statistics","de":"Die aktuellen Statistiken werden genannt (Zahlen mit Zeitraum und prüfbarer Quelle), die Indikatoren passen zum Dienstziel, und bei unvollständigen Daten existiert ein terminierter Plan. Bei neuen Diensten zählen aufgelistete qualitative Nachweise plus ein terminierter Plan als aktuelle Statistik"},"when":{"required":[0,3],"requiredAny":[1,2]}},{"result":"Not met","rule":{"en":"No latest statistics, no period, no source, only generic claims (\"widely used\"), or no dated plan where data is incomplete","de":"Keine aktuellen Statistiken, kein Zeitraum, keine Quelle, nur allgemeine Aussagen („weit verbreitet“), oder bei unvollständigen Daten kein terminierter Plan"}}],"scoringIntro":"","scoringNote":{"en":"Usage data does not have to exist at the time of review. The qualitative route keeps the rule consistent with this.","de":"Nutzungsdaten müssen zum Zeitpunkt der Prüfung nicht vorliegen. Der qualitative Weg hält die Regel damit konsistent."},"whyForm":"","tags":[]},{"id":"k13","number":13,"title":{"en":"National relevance and link to the NFDI","de":"Nationale Bedeutung und Bezug zur NFDI"},"category":"strategisch","form":"freetext","checklistLabel":null,"asks":[{"label":"Should","text":{"en":"The service is available to researchers or the target group at least across Germany.","de":"Der Dienst steht Forschenden bzw. der Zielgruppe mindestens deutschlandweit zur Verfügung."}},{"label":"Should","text":{"en":"The service is usually run and owned by one or more NFDI member organisations that are part of the applying consortium.","de":"Der Dienst wird in der Regel von einer oder mehreren NFDI-Mitgliedsorganisationen betrieben und verantwortet, die dem beantragenden Konsortium angehören."}},{"label":"Should","text":{"en":"The link to the goals of the NFDI under the Bund-Länder-Vereinbarung or the statutes is clearly shown, for example by addressing discipline-specific or cross-cutting RDM needs, or by being embedded in one or more consortia.","de":"Der Bezug zu den Zielen der NFDI gemäß Bund-Länder-Vereinbarung bzw. Satzung ist klar dargelegt, zum Beispiel durch die Adressierung fachspezifischer oder übergreifender FDM-Bedarfe oder durch die Einbettung in ein oder mehrere Konsortien."}}],"typeHelp":{"software":{"en":"Access conditions, operating institution, consortium role.","de":"Zugangsbedingungen, betreibende Einrichtung, Rolle im Konsortium."},"storage":{"en":"Who may deposit and access, which institutions operate it.","de":"Wer einstellen und zugreifen darf, welche Einrichtungen es betreiben."},"training":{"en":"Who can attend nationwide, which institutions organise it.","de":"Wer deutschlandweit teilnehmen kann, welche Einrichtungen es veranstalten."},"consulting":{"en":"Who may request advice, which institutions provide it.","de":"Wer Beratung anfragen darf, welche Einrichtungen sie anbieten."},"process":{"en":"Which institutions use or run the process.","de":"Welche Einrichtungen den Prozess nutzen oder betreiben."},"other":{"en":"Which communities adopt it and who maintains it.","de":"Welche Communities es übernehmen und wer es pflegt."}},"evidence":[{"en":"Access conditions: who can use it and any restrictions","de":"Zugangsbedingungen: wer es nutzen kann und welche Einschränkungen gelten"},{"en":"Operating institution and proof of NFDI e.V. and consortium membership","de":"Betreibende Einrichtung und Nachweis der Mitgliedschaft im NFDI e.V. und im Konsortium"},{"en":"A short paragraph citing the BLV or the statutes and the RDM need addressed","de":"Ein kurzer Absatz mit Bezug auf die BLV oder die Satzung und den adressierten FDM-Bedarf"},{"en":"Consortium role (proposing or using consortia)","de":"Rolle im Konsortium (vorschlagende oder nutzende Konsortien)"},{"en":"Use or demand that shows national relevance","de":"Nutzung oder Nachfrage, die die nationale Relevanz zeigt"}],"tips":[{"en":"Availability beyond Germany is fine. The service must be available at least across Germany.","de":"Verfügbarkeit über Deutschland hinaus ist in Ordnung. Der Dienst muss mindestens deutschlandweit verfügbar sein."},{"en":"Operators that are not NFDI members are possible in exceptional cases. Explain who is responsible and how the link to a member is secured.","de":"Betreiber, die keine NFDI-Mitglieder sind, sind in Ausnahmefällen möglich. Erklären Sie, wer verantwortlich ist und wie die Verbindung zu einem Mitglied gesichert ist."},{"en":"Disciplinary and cross-cutting services differ in how they show the link: community and consortium versus many disciplines.","de":"Disziplinäre und übergreifende Dienste unterscheiden sich darin, wie sie den Bezug zeigen: Community und Konsortium gegenüber vielen Disziplinen."}],"questions":[],"levels":[],"scoringIntro":"","scoringNote":"","whyForm":{"en":"Strategic criteria are answered in free text and are not scored.","de":"Strategische Kriterien werden im Freitext beantwortet und nicht bewertet."},"tags":["Survey","information"]},{"id":"k14","number":14,"title":{"en":"Open source","de":"Open Source"},"category":"strategisch","form":"freetext","checklistLabel":null,"asks":[{"label":"Should","text":{"en":"The service is preferably based on open-source software.","de":"Der Dienst basiert bevorzugt auf Open-Source-Software."}},{"label":"Mandatory","text":{"en":"Software components developed by the service itself are published under an open-source licence recognised by the OSI, for example MIT, Apache 2.0 or GPL-3.0.","de":"Vom Dienst selbst entwickelte Software-Komponenten sind unter einer von der OSI anerkannten Open-Source-Lizenz veröffentlicht, zum Beispiel MIT, Apache 2.0 oder GPL-3.0."}},{"label":"Should","text":{"en":"The service is classified as fully, partly or not open source. If proprietary components are used, a short reason explains why no open alternative is used.","de":"Der Dienst ist als vollständig, teilweise oder nicht Open Source eingeordnet. Werden proprietäre Komponenten genutzt, erklärt eine kurze Begründung, warum keine offene Alternative eingesetzt wird."}},{"label":"Should","text":{"en":"A link to the public source code repository and the name of the licence are given.","de":"Ein Link zum öffentlichen Quellcode-Repositorium und der Name der Lizenz sind angegeben."}}],"typeHelp":{"software":{"en":"Repository link, licence file, list of third-party licences.","de":"Repositorium-Link, Lizenzdatei, Liste der Lizenzen Dritter."},"storage":{"en":"Open platform software and its licence, plus any proprietary hosting.","de":"Offene Plattform-Software und ihre Lizenz, plus gegebenenfalls proprietäres Hosting."},"training":{"en":"Open licence for materials (e.g. CC-BY) instead of software licence.","de":"Offene Lizenz für Materialien (z. B. CC-BY) statt einer Softwarelizenz."},"consulting":{"en":"Usually not applicable; state open documentation if any.","de":"Meist nicht anwendbar; offene Dokumentation angeben, falls vorhanden."},"process":{"en":"Open documentation or workflow definitions with a licence.","de":"Offene Dokumentation oder Workflow-Definitionen mit Lizenz."},"other":{"en":"Open licence for the vocabulary or standard text and tools.","de":"Offene Lizenz für den Vokabular- oder Standardtext und die Werkzeuge."}},"evidence":[{"en":"Public repository link","de":"Link zum öffentlichen Repositorium"},{"en":"Licence file in the repository root (OSI-approved)","de":"Lizenzdatei im Stammverzeichnis des Repositoriums (OSI-anerkannt)"},{"en":"List of third-party components and licences (e.g. SBOM)","de":"Liste der Komponenten Dritter und Lizenzen (z. B. SBOM)"},{"en":"For proprietary parts: short justification and a replacement plan","de":"Für proprietäre Teile: kurze Begründung und ein Ersatzplan"},{"en":"Citable release (e.g. DOI)","de":"Zitierfähiges Release (z. B. DOI)"}],"tips":[{"en":"\"Partly\" is a valid answer; classify honestly.","de":"„Teilweise“ ist eine gültige Antwort; klassifizieren Sie ehrlich."},{"en":"A licence like \"free for research use only\" is not OSI-approved.","de":"Eine Lizenz wie „nur für Forschungszwecke kostenlos“ ist nicht OSI-anerkannt."},{"en":"A private or on-request repository does not meet the criterion.","de":"Ein privates oder nur auf Anfrage zugängliches Repositorium erfüllt das Kriterium nicht."},{"en":"Licence compatibility questions belong to your institution's legal or open-source contact.","de":"Fragen zur Lizenzkompatibilität gehören zur Rechtsabteilung oder zur Open-Source-Ansprechperson Ihrer Einrichtung."}],"questions":[],"levels":[],"scoringIntro":"","scoringNote":"","whyForm":{"en":"Strategic criteria are answered in free text and are not scored.","de":"Strategische Kriterien werden im Freitext beantwortet und nicht bewertet."},"tags":["Survey","information"]},{"id":"k15","number":15,"title":{"en":"Non-profit principle","de":"Non-Profit-Prinzip"},"category":"strategisch","form":"freetext","checklistLabel":null,"asks":[{"label":"Should","text":{"en":"The service is provided on a non-profit basis within the NFDI. Its aim is not profit or financial surplus.","de":"Der Dienst wird innerhalb der NFDI gemeinnützig bereitgestellt. Sein Ziel ist nicht Gewinn oder finanzieller Überschuss."}},{"label":"Optional","text":{"en":"Other uses, such as contract research or services for commercial parties, are allowed but are regulated separately and in line with tax law. (Optional.)","de":"Weitere Nutzungen, etwa Auftragsforschung oder Leistungen für kommerzielle Akteure, sind erlaubt, werden aber gesondert und steuerrechtlich konform geregelt. (Optional.)"}},{"label":"Optional","text":{"en":"The service does not have to be free of charge. Fees may cover the costs of operation, maintenance, support or infrastructure, but not more. (Optional.)","de":"Der Dienst muss nicht kostenfrei sein. Gebühren dürfen die Kosten für Betrieb, Wartung, Support oder Infrastruktur decken, aber nicht mehr. (Optional.)"}},{"label":"Should","text":{"en":"Income is used to maintain and further develop the service.","de":"Einnahmen werden für Erhalt und Weiterentwicklung des Dienstes verwendet."}},{"label":"Should","text":{"en":"The fee model is transparent and published.","de":"Das Gebührenmodell ist transparent und veröffentlicht."}}],"typeHelp":{"software":{"en":"Hosting and operating costs, any fees, and how income is used.","de":"Hosting- und Betriebskosten, etwaige Gebühren und wie die Einnahmen verwendet werden."},"storage":{"en":"Storage or hosting fees, cost model.","de":"Speicher- oder Hosting-Gebühren, Kostenmodell."},"training":{"en":"Course fees or free participation, cost coverage.","de":"Kursgebühren oder kostenfreie Teilnahme, Kostendeckung."},"consulting":{"en":"Fee or free of charge, cost-covering principle.","de":"Gebühr oder kostenfrei, Kostendeckungsprinzip."},"process":{"en":"Fees for running the process, if any.","de":"Gebühren für den Betrieb des Prozesses, falls vorhanden."},"other":{"en":"Usually free; state any fees.","de":"Meist kostenfrei; nennen Sie etwaige Gebühren."}},"evidence":[{"en":"Link to the fee model or price list, or a statement that none exists","de":"Link zum Gebührenmodell oder zur Preisliste, oder eine Aussage, dass keines existiert"},{"en":"Funding source","de":"Finanzierungsquelle"},{"en":"How income is used (cost centre, budget line)","de":"Wie Einnahmen verwendet werden (Kostenstelle, Haushaltstitel)"},{"en":"For commercial use: contract template or note that it is handled separately","de":"Bei kommerzieller Nutzung: Vertragsvorlage oder Hinweis, dass sie gesondert geregelt wird"}],"tips":[{"en":"The criterion does not require a free service; only profit or surplus is the red line.","de":"Das Kriterium verlangt keinen kostenfreien Dienst; nur Gewinn oder Überschuss ist die rote Linie."},{"en":"Keep commercial use separate from the NFDI service description.","de":"Halten Sie kommerzielle Nutzung getrennt von der Beschreibung des NFDI-Dienstes."},{"en":"Tax questions are for your institution's finance or legal office.","de":"Steuerfragen gehören zur Finanz- oder Rechtsabteilung Ihrer Einrichtung."}],"questions":[],"levels":[],"scoringIntro":"","scoringNote":"","whyForm":{"en":"Strategic criteria are answered in free text and are not scored.","de":"Strategische Kriterien werden im Freitext beantwortet und nicht bewertet."},"tags":["Survey","information"]}]}

var STORE_KEY='nfdi-assessment-tool-v1';
var FORMS=['binary','threelevel','checklist','freetext'];
var LANG='en';

/* ---------- language helpers ---------- */
function setLang(l){LANG=(l==='de')?'de':'en';return LANG;}
function getLang(){return LANG;}
function t(key,args){
  var s=(UI[LANG]&&UI[LANG][key]!=null)?UI[LANG][key]:(UI.en[key]!=null?UI.en[key]:key);
  (args||[]).forEach(function(a,i){s=s.split('{'+i+'}').join(a);});
  return s;
}
function hasKey(key){return UI.en[key]!=null;}
/* L: pick the text for the current language from a string or {en,de} object */
function L(x){
  if(x==null){return '';}
  if(typeof x==='string'){return x;}
  if(typeof x==='object'){var o=(LANG==='de')?(x.de||x.en):(x.en||x.de);return o==null?'':String(o);}
  return String(x);
}
function isPair(x){return x&&typeof x==='object'&&!Array.isArray(x)&&('en' in x||'de' in x)&&Object.keys(x).every(function(k){return k==='en'||k==='de';});}
function countMissing(d,lang){
  var n=0;
  (function walk(o){
    if(isPair(o)){if(!o[lang]||!String(o[lang]).trim()){n++;}return;}
    if(Array.isArray(o)){o.forEach(walk);}
    else if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){walk(o[k]);});}
  })(d);
  return n;
}
function lab(prefix,v){var k=prefix+'.'+String(v).replace(/\*/g,'');return hasKey(k)?t(k):String(v).replace(/\*/g,'');}
function catLabel(c){return String(c.category).split(',').map(function(x){x=x.trim();return lab('cat',x);}).join(', ');}
function resLabel(r){return r?lab('res',r):'';}

/* ---------- pure helpers (also used by tests) ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function hasText(x){return !!L(x).trim()||(isPair(x)&&!!((x.en||'')+(x.de||'')).trim());}

function validateData(d){
  var p=[];
  if(!d||typeof d!=='object'){return ['The file is empty or not an object.'];}
  if(!d.version){p.push('Missing "version".');}
  if(!Array.isArray(d.types)||!d.types.length){p.push('"types" must be a non-empty list.');}
  else d.types.forEach(function(ty,i){if(!ty.id||!hasText(ty.label)){p.push('types['+i+'] needs "id" and "label".');}});
  if(!Array.isArray(d.criteria)||!d.criteria.length){p.push('"criteria" must be a non-empty list.');return p;}
  var seen={};
  d.criteria.forEach(function(c,i){
    var n='criteria['+i+']'+(c&&c.id?' ('+c.id+')':'');
    if(!c.id){p.push(n+': missing "id".');}
    else if(seen[c.id]){p.push(n+': duplicate id.');} else {seen[c.id]=1;}
    if(!hasText(c.title)){p.push(n+': missing "title".');}
    else if(isPair(c.title)&&(!c.title.en||!c.title.de)){p.push(n+': "title" needs both "en" and "de".');}
    if(FORMS.indexOf(c.form)<0){p.push(n+': "form" must be one of '+FORMS.join(', ')+'.');}
    if(c.form!=='freetext'&&(!c.questions||!c.questions.length)){p.push(n+': needs "questions" (the rating is calculated from them).');}
    if(c.form!=='freetext'&&(!c.levels||!c.levels.length)){p.push(n+': needs "levels" for a rating.');}
    else if(c.form!=='freetext'){c.levels.forEach(function(l,j){if(j<c.levels.length-1&&!l.when){p.push(n+': level "'+l.result+'" needs a "when" rule (only the last level may have none).');}});}
  });
  return p;
}

function freshState(d){return {criteriaVersion:d.version,lang:LANG,step:0,meta:{consortium:'',service:'',provider:'',contact:'',type:''},answers:{}};}
function ans(s,id){
  if(!s.answers[id]){s.answers[id]={na:false,naReason:'',rating:'',text:'',evidence:'',checks:{},naNotes:{},qtext:{},expert:'',workload:''};}
  return s.answers[id];
}
function statusOf(s,c){
  var a=s.answers[c.id];
  if(!a){return 'open';}
  if(a.na){return a.naReason&&a.naReason.trim()?'na':'open';}
  var anyCheck=false;for(var k in a.checks){if(a.checks[k]){anyCheck=true;}}
  if((a.text&&a.text.trim())||anyCheck){return 'answered';}
  return 'open';
}
function typeLabel(d,id){var ty=(d.types||[]).filter(function(x){return x.id===id;})[0];return ty?L(ty.label):'';}
function typeDesc(ty){return ty.desc?L(ty.desc):(hasKey('type.'+ty.id)?t('type.'+ty.id):'');}
function counts(d,s){var r={answered:0,na:0,open:0};d.criteria.forEach(function(c){r[statusOf(s,c)]++;});return r;}
function statLabel(k){return t('stat.'+k);}
function chk(k){return t('chk.'+k);}
/* automatic rating from the checklist answers (rules in criteria.json: level.when) */
function autoRating(c,a){
  if(!c||c.form==='freetext'||!c.questions||!c.questions.length||!c.levels||!c.levels.length){return null;}
  var ch=(a&&a.checks)||{},n=c.questions.length,answered=0,i;
  for(i=0;i<n;i++){if(ch[i]){answered++;}}
  if(answered<n){return {done:false,answered:answered,total:n};}
  var sat=function(k){return ch[k]==='yes'||ch[k]==='na';},yes=function(k){return ch[k]==='yes';};
  var satCount=0;for(i=0;i<n;i++){if(sat(i)){satCount++;}}
  for(i=0;i<c.levels.length;i++){
    var l=c.levels[i],w=l.when;
    if(!w){return {done:true,answered:n,total:n,result:l.result,level:l,index:i};}
    var ok=true;
    if(w.minYes!=null&&satCount<w.minYes){ok=false;}
    if(ok&&w.required){w.required.forEach(function(k){if(!sat(k)){ok=false;}});}
    if(ok&&w.requiredYes){w.requiredYes.forEach(function(k){if(!yes(k)){ok=false;}});}
    if(ok&&w.requiredAny&&!w.requiredAny.some(yes)){ok=false;}
    if(ok){return {done:true,answered:n,total:n,result:l.result,level:l,index:i};}
  }
  var last=c.levels.length-1;
  return {done:true,answered:n,total:n,result:c.levels[last].result,level:c.levels[last],index:last};
}
/* Evidence to attach + practical points: a collapsible block shown right under the criterion explanation */
function moreHtml(c){
  var m='';
  if(c.evidence&&c.evidence.length){m+='<h3>'+esc(t('crit.evidenceH'))+'</h3><ul>'+c.evidence.map(function(e){return '<li>'+esc(L(e))+'</li>';}).join('')+'</ul>';}
  if(c.tips&&c.tips.length){m+='<h3>'+esc(t('crit.tipsH'))+'</h3><ul>'+c.tips.map(function(e){return '<li>'+esc(L(e))+'</li>';}).join('')+'</ul>';}
  return m?'<details class="inanswer"><summary>'+esc(t('crit.moreSum'))+'</summary><div>'+m+'</div></details>':'';
}
/* 4. Checklist parts.
   exText: text of the editable field under a question answered Yes.
   It starts with the 'example' from criteria.json; the user's own edits are kept. */
function exText(q,i,a){var qt=a&&a.qtext;return (qt&&qt[i]!==undefined)?qt[i]:(q.example?L(q.example):'');}
function exHtml(q,i,v,a){
  if(v==='na'){var note=a&&a.naNotes&&a.naNotes[i];return '<div class="callout warn exbox"><label class="f" for="nan'+i+'" style="margin-top:0">'+esc(t('crit.nanote'))+'<span class="hint">'+esc(t('crit.nanote.h'))+'</span></label><textarea class="short" id="nan'+i+'" data-nanote="'+i+'" placeholder="'+esc(t('crit.naex'))+'">'+esc(note||'')+'</textarea></div>';}
  if(v!=='yes'){return '';}
  return '<div class="callout warn exbox"><label class="f" for="qt'+i+'" style="margin-top:0">'+esc(t('crit.example'))+'<span class="hint">'+esc(t('crit.example.h'))+'</span></label><textarea class="short" id="qt'+i+'" data-qtext="'+i+'">'+esc(exText(q,i,a))+'</textarea></div>';
}
function feedbackHtml(c,a){
  var h='<div class="card inner" style="margin-top:1rem"><h3>'+esc(t('fb.h'))+'</h3>';
  h+='<label class="f" for="expert" style="margin-top:0">'+esc(t('fb.expert'))+'<span class="hint">'+esc(t('fb.expert.h'))+'</span></label><textarea class="short" id="expert" data-field="expert">'+esc(a.expert||'')+'</textarea>';
  h+='<fieldset style="margin-top:1rem"><legend>'+esc(t('fb.work'))+'</legend><div class="opts" role="radiogroup" aria-label="'+esc(t('fb.work'))+'">';
  ['heavy','medium','low'].forEach(function(o){h+='<label><input type="radio" name="workload" data-workload="'+o+'" value="'+o+'"'+(a.workload===o?' checked':'')+'>'+esc(t('fb.w.'+o))+'</label>';});
  return h+'</div></fieldset></div>';
}
/* Result text shown for a criterion (empty until the checklist is complete) */
function ratingFor(c,a){var r=autoRating(c,a);return r&&r.done?resLabel(r.result):'';}
function resultHtml(c,a){
  var r=autoRating(c,a);if(!r){return '';}
  if(!r.done){return '<strong>'+esc(t('crit.result'))+'</strong> '+esc(t('crit.result.incomplete',[r.total,r.answered]));}
  return '<strong>'+esc(t('crit.result'))+': '+esc(resLabel(r.result))+'</strong><br><span class="hint">'+esc(L(r.level.rule))+'</span>';
}

/* 5. Exports. buildMarkdown makes the Obsidian note (language of the page). */
function buildMarkdown(d,s){
  var m=s.meta,date=new Date().toISOString().slice(0,10),L_=[],svc=m.service||t('md.unnamed');
  L_.push('---');
  L_.push('title: "'+t('md.title',[svc.replace(/"/g,"'")])+'"');
  L_.push('tags: [NFDI, assessment]');
  L_.push('language: '+LANG);
  L_.push('consortium: "'+(m.consortium||'').replace(/"/g,"'")+'"');
  L_.push('service: "'+(m.service||'').replace(/"/g,"'")+'"');
  L_.push('type: "'+typeLabel(d,m.type)+'"');
  L_.push('criteria_version: "'+d.version+'"');
  L_.push('date: '+date);
  L_.push('---','');
  L_.push('# '+t('md.h1',[svc]),'');
  L_.push('| '+t('md.field')+' | '+t('md.value')+' |','|---|---|');
  L_.push('| '+t('md.consortium')+' | '+(m.consortium||'-')+' |');
  L_.push('| '+t('md.provider')+' | '+(m.provider||'-')+' |');
  L_.push('| '+t('md.contact')+' | '+(m.contact||'-')+' |');
  L_.push('| '+t('md.type')+' | '+(typeLabel(d,m.type)||'-')+' |');
  L_.push('| '+t('md.version')+' | '+d.version+' |','');
  L_.push('## '+t('md.overview'),'','| '+t('th.no')+' | '+t('th.crit')+' | '+(LANG==='de'?'Kategorie':'Category')+' | '+t('th.stat')+' | '+t('th.rating')+' |','|---:|---|---|---|---|');
  d.criteria.forEach(function(c){var a=s.answers[c.id]||{};L_.push('| '+c.number+' | '+L(c.title)+' | '+catLabel(c)+' | '+statLabel(statusOf(s,c))+' | '+(a.na?t('sum.na'):(ratingFor(c,a)||'-'))+' |');});
  L_.push('');
  d.criteria.forEach(function(c){
    var a=s.answers[c.id]||{checks:{}};
    L_.push('## '+t('md.crit',[c.number,L(c.title)]),'','*'+t('md.cat',[catLabel(c)])+'*','');
    if(c.tags&&c.tags.length){L_.push(t('md.tags')+' '+c.tags.map(function(x){return '#'+x;}).join(' '),'');}
    if(a.na){L_.push(t('md.na',[a.naReason||t('md.none')]),'');return;}
    if(c.form!=='freetext'){var ar=autoRating(c,a);L_.push(t('md.rating',[ar&&ar.done?resLabel(ar.result)+' ('+t('md.auto')+')':(ar?t('md.incomplete',[ar.answered,ar.total]):t('md.notrated'))]),'');}
    if(c.questions&&c.questions.length){
      L_.push('**'+lab('chkl',c.checklistLabel||'Checklist')+':**','');
      c.questions.forEach(function(q,i){var v=a.checks&&a.checks[i];L_.push('- '+(v==='yes'?'[x]':'[ ]')+' '+L(q.q)+' ('+(v?chk(v):t('md.notans'))+')');var qa=v==='yes'&&a.qtext&&a.qtext[i];if(qa&&qa.trim()){L_.push('  - '+t('md.answer').replace(/\*/g,'')+' '+qa.trim().replace(/\n+/g,' '));}var nn=v==='na'&&a.naNotes&&a.naNotes[i];if(nn&&nn.trim()){L_.push('  - '+t('md.nanote')+' '+nn.trim().replace(/\n+/g,' '));}});
      L_.push('');
    }
    if((a.expert&&a.expert.trim())||a.workload){L_.push(t('md.expert'),'',a.expert&&a.expert.trim()?a.expert.trim():t('md.noanswer'),'',t('md.workload')+' '+(a.workload?t('fb.w.'+a.workload):t('md.notanswered')),'');}
    L_.push(t('md.answer'),'',a.text&&a.text.trim()?a.text.trim():t('md.noanswer'),'');
    if(a.evidence&&a.evidence.trim()){L_.push(t('md.evidence'),'');a.evidence.trim().split(/\n+/).forEach(function(e){L_.push('- '+e.replace(/^[-*]\s*/,''));});L_.push('');}
  });
  return L_.join('\n');
}

/* ---------- renderers (return HTML strings) ---------- */
function stepCount(d){return d.criteria.length+3;}
function renderNav(d,s){
  var n=stepCount(d),c=counts(d,s),pct=Math.round(100*(c.answered+c.na)/d.criteria.length);
  var h='<details open id="navdet"><summary>'+esc(t('nav.steps',[pct]))+'</summary><div class="progress" aria-hidden="true"><span style="width:'+pct+'%"></span></div><ol>';
  function item(i,label,st){
    var sym=st==='answered'?'✓':st==='na'?'–':st==='open'?'○':'';
    var aria=st?' ('+statLabel(st)+')':'';
    return '<li><button type="button" data-go="'+i+'"'+(s.step===i?' aria-current="step"':'')+'><span class="st '+(st||'')+'" aria-hidden="true">'+sym+'</span><span>'+esc(label)+'<span class="sr">'+esc(aria)+'</span></span></button></li>';
  }
  h+=item(0,t('nav.start'),'');h+=item(1,t('nav.about'),s.meta.type&&s.meta.service?'answered':'open');
  d.criteria.forEach(function(cr,i){h+=item(i+2,cr.number+'. '+L(cr.title),statusOf(s,cr));});
  h+=item(n-1,t('nav.summary'),'');
  return h+'</ol></details>';
}
function renderStart(d,s,fallback,note){
  var h='<div class="card"><p class="eyebrow">'+esc(t('start.eyebrow'))+'</p><h1 class="title" id="h" tabindex="-1">'+esc(t('start.title'))+'</h1>';
  h+='<p>'+esc(t('start.intro'))+'</p>';
  h+='<ol><li>'+esc(t('start.l1'))+'</li><li>'+esc(t('start.l2',[d.criteria.length]))+'</li><li>'+esc(t('start.l3'))+'</li></ol>';
  h+='<div class="callout">'+t('start.privacy')+'</div>';
  h+='<div class="callout">'+t('start.save')+'</div>';
  h+='<div class="callout warn">'+t('start.draft',[esc(d.version),esc(L(d.source))])+'</div>';
  var miss=countMissing(d,LANG);
  if(miss){h+='<div class="callout warn">'+esc(t('miss',[miss]))+'</div>';}
  if(fallback){h+='<div class="callout warn">'+t('start.fb',[esc(fallback)])+'</div>';}
  if(note){h+='<div class="callout warn">'+t('start.check',[esc(note)])+'</div>';}

/* The report as a list of {k, x}. k = h1 | h2 | lab (bold label) | p | li | li2 (indented). Language of the page.

function reportItems(d,s){

/* Split a line into plain and link parts (http/https links become clickable in the PDF) */
function pdfSegs(line){

function buildPdf(d,s){

  var STYLE={h1:[16,1,6,0,0],h2:[12,1,4,0,12],lab:[10,1,1,0,5],p:[10,0,2,0,0],li:[10,0,1,10,0],li2:[9,0,2,24,0]};

    var st=STYLE[item.k],size=st[0],bold=st[1],lead=size*1.35,x=M+st[3],prefix=(item.k==='li'?'- ':''),lines=pdfWrap(prefix+item.x,size,bold,maxW-st[3]);

  var kids=[],p;for(p=0;p<n;p++){kids.push((5+p*2)+' 0 R');}
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

    var cs='',foot=(LANG==='de'?'Seite ':'Page ')+(pi+1)+' / '+n;
    pg.forEach(function(r){r.parts.forEach(function(pt){cs+=(pt.url?'0 0.365 0.494 rg ':'0 0 0 rg ')+'BT /F'+(r.bold?2:1)+' '+r.size+' Tf '+pt.x.toFixed(1)+' '+r.y.toFixed(1)+' Td ('+esc2(pt.s)+') Tj ET\n';});});
    cs+='0 0 0 rg BT /F1 8 Tf '+(W-M-50)+' 25 Td ('+esc2(foot)+') Tj ET\n';
    objs[5+pi*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+pi*2)+' 0 R'+(annotIds[pi].length?' /Annots ['+annotIds[pi].map(function(id){return id+' 0 R';}).join(' ')+']':'')+' >>';

    setTimeout(function(){a.remove();},1000);
    var note=document.getElementById('dlnote');
    if(note){note.innerHTML='';var p=document.createElement('span');p.textContent=t('dl.ready',[name])+' ';var l=document.createElement('a');l.href=url;l.download=name;l.target='_blank';l.rel='noopener';l.textContent=t('dl.link');note.appendChild(p);note.appendChild(l);}
  }catch(err){window.alert(t('dl.fail',[err&&err.message?err.message:String(err)]));}
}
/* buildResult makes the machine-readable JSON (always both languages, English rating values). */
function both(x){if(x&&typeof x==='object'){return {en:x.en||'',de:x.de||''};}return {en:x||'',de:x||''};}
function buildResult(d,s){
  var cn=counts(d,s);
  return {
    schema:'nfdi-assessment-result/2',
    tool:'nfdi-assessment-tool',
    criteriaVersion:d.version,
    exportedAt:new Date().toISOString(),
    service:{name:s.meta.service||'',consortium:s.meta.consortium||'',provider:s.meta.provider||'',contact:s.meta.contact||'',offerType:s.meta.type||'',offerTypeLabel:both((d.types||[]).filter(function(x){return x.id===s.meta.type;}).map(function(x){return x.label;})[0]||'')},
    state:s, /* the raw answers: lets the start page re-import this same file to continue later */
    summary:{criteria:d.criteria.length,answered:cn.answered,notApplicable:cn.na,open:cn.open},
    criteria:d.criteria.map(function(c){
      var a=s.answers[c.id]||{checks:{}},ar=(c.form!=='freetext'&&!a.na)?autoRating(c,a):null,qs=c.questions||[];
      return {
        number:c.number,id:c.id,title:both(c.title),category:c.category||'',tags:c.tags||[],
        status:statusOf(s,c),
        notApplicable:!!a.na,notApplicableReason:a.na?(a.naReason||''):'',
        rating:ar&&ar.done?{value:ar.result,source:'calculated from checklist'}:null,
        checklist:{answered:ar?ar.answered:0,total:qs.length},
        questions:qs.map(function(q,i){var v=(a.checks&&a.checks[i])||'';return {index:i,question:both(q.q),answer:v==='yes'||v==='no'||v==='na'?v:null,answerText:v==='yes'?((a.qtext&&a.qtext[i])||''):'',notApplicableReason:v==='na'?((a.naNotes&&a.naNotes[i])||''):''};}),
        expertComment:a.expert||'',expectedWorkload:a.workload||null,
        answer:a.text||'',
        evidence:(a.evidence||'').split(/\n+/).map(function(e){return e.replace(/^[-*]\s*/,'').trim();}).filter(Boolean)
      };
    })
  };
}
function fileBase(){return (slug(S.meta.service)||'assessment')+'-nfdi-assessment-'+LANG;}
function cur(){var i=S.step-2;return (i>=0&&i<DATA.criteria.length)?DATA.criteria[i]:null;}

/* Clicks: buttons (language, next/previous, exports, reset). */
document.addEventListener('click',function(e){
  var tg=e.target.closest('[data-lang],[data-go],[data-next],[data-prev],[data-use],[data-act]');if(!tg){return;}
  if(tg.hasAttribute('data-lang')){switchLang(tg.getAttribute('data-lang'));}
  else if(tg.hasAttribute('data-go')){go(parseInt(tg.getAttribute('data-go'),10));}
  else if(tg.hasAttribute('data-next')){go(S.step+1);}
  else if(tg.hasAttribute('data-prev')){go(S.step-1);}
  else{
    var act=tg.getAttribute('data-act');
    if(act==='dl-md'){download(fileBase()+'.md',buildMarkdown(DATA,S),'text/markdown');}
    else if(act==='dl-res'){download(fileBase()+'-result.json',JSON.stringify(buildResult(DATA,S),null,2),'application/json');}
    else if(act==='pdf'){download(fileBase()+'.pdf',buildPdf(DATA,S),'application/pdf');}
    else if(act==='reset'){if(window.confirm(t('reset.confirm'))){S=freshState(DATA);save();go(0);}}
  }
});
/* Typing: every text field is saved to the browser while the user types. */
document.addEventListener('input',function(e){
  var tg=e.target;
  if(tg.hasAttribute('data-meta')){S.meta[tg.getAttribute('data-meta')]=tg.value;save();refreshNav();}
  else if(tg.hasAttribute('data-qtext')){var cq=cur();if(cq){var aq=ans(S,cq.id);aq.qtext=aq.qtext||{};aq.qtext[tg.getAttribute('data-qtext')]=tg.value;save();}}
  else if(tg.hasAttribute('data-nanote')){var cn=cur();if(cn){var an=ans(S,cn.id);an.naNotes=an.naNotes||{};an.naNotes[tg.getAttribute('data-nanote')]=tg.value;save();}}
  else if(tg.hasAttribute('data-field')){var c=cur();if(c){ans(S,c.id)[tg.getAttribute('data-field')]=tg.value;save();refreshNav();}}
});
/* Choices: radio buttons (Yes / No / Not applicable, workload), checkboxes, file import. */
document.addEventListener('change',function(e){
  var tg=e.target,c=cur();
  if(tg.id==='imp'){
    var f=tg.files&&tg.files[0];if(!f){return;}
    var r=new FileReader();r.onload=function(){
      try{var j=JSON.parse(r.result);if(!j.state||!j.state.answers){throw new Error(t('imp.noState'));}
        S=j.state;S.step=0;S.lang=LANG;noteState=(j.criteriaVersion&&j.criteriaVersion!==DATA.version)?{kind:'import',from:j.criteriaVersion}:null;
        save();show();}
      catch(err){window.alert(t('imp.fail',[err.message]));}
    };r.readAsText(f);
  }
  else if(tg.hasAttribute('data-type')){S.meta.type=tg.getAttribute('data-type');save();refreshNav();}
  else if(tg.hasAttribute('data-na')&&c){ans(S,c.id).na=tg.checked;save();show();var f2=document.getElementById(tg.checked?'naReason':'text');if(f2){f2.focus();}}
  else if(tg.hasAttribute('data-workload')&&c){ans(S,c.id).workload=tg.value;save();}
  else if(tg.hasAttribute('data-check')&&c){var a3=ans(S,c.id);var ci=parseInt(tg.getAttribute('data-check'),10);a3.checks[ci]=tg.value;if(tg.value==='yes'){a3.qtext=a3.qtext||{};if(a3.qtext[ci]===undefined){a3.qtext[ci]=exText(c.questions[ci],ci,a3);}}save();refreshNav();var exd=document.getElementById('ex'+ci);if(exd){exd.innerHTML=exHtml(c.questions[ci],ci,tg.value,a3);}var rp=document.getElementById('autoresult');if(rp){rp.innerHTML=resultHtml(c,a3);}}
});

function start(d,reason){
  var problems=validateData(d);
  if(problems.length){
    document.getElementById('ver').textContent=t('hdr.error');
    document.getElementById('nav').innerHTML='';
    document.getElementById('main').innerHTML='<div class="card"><h1 class="title" id="h" tabindex="-1">'+esc(t('err.title'))+'</h1><div class="callout bad"><ul>'+problems.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div><p>'+esc(t('err.fix'))+'</p></div>';
    return;
  }
  DATA=d;fbReason=reason||null;
  var saved=loadSaved();
  if(saved&&saved.answers&&saved.meta){
    S=saved;
    if(saved.criteriaVersion!==d.version){noteState={kind:'saved',from:saved.criteriaVersion};S.criteriaVersion=d.version;}
    if(saved.lang==='de'||saved.lang==='en'){setLang(saved.lang);}
  } else {
    S=freshState(d);
    var nl=(typeof navigator!=='undefined'&&navigator.language)||'en';
    setLang(String(nl).toLowerCase().indexOf('de')===0?'de':'en');S.lang=LANG;
  }
  if(window.innerWidth<860){var nd=document.getElementById('navdet');if(nd){nd.removeAttribute('open');}}
  show();save();
}

function init(){
  var fb=JSON.parse(document.getElementById('fallback-data').textContent);
  applyStatic();
  var url='criteria.json';
  if(typeof fetch!=='function'){start(fb,'fetch not available');return;}
  fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok){throw new Error('HTTP '+r.status);}return r.text();})
   .then(function(tx){var d;try{d=JSON.parse(tx);}catch(err){throw new Error('criteria.json is not valid JSON ('+err.message+')');}start(d,'');})
   .catch(function(err){start(fb,err.message);});
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}

})();
</script>
</body>
